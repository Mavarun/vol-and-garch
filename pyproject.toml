[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vol-and-garch"
version = "0.1.0"
description = "Research slice: realized volatility and simple GARCH(1,1) forecasts vs next-day squared returns (MSE/QLIKE)."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "M.Varun", email = "116015799+Mavarun@users.noreply.github.com" }]
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
